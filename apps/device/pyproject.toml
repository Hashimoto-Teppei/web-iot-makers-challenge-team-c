[project]
name = "device"
version = "0.1.0"
description = "自転車に載せるデバイス（Raspberry Pi Zero 2 W）の危険検知プログラム"
requires-python = ">=3.13,<3.14"
# 実行時の依存はまだない。BLE や GPS のライブラリは必要になった時点で追加する。
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
  "basedpyright>=1.31",
]
# 実機（Raspberry Pi）でしか動かない依存。既定では入らない。
# 実機だけ `uv sync --group device` で入れる（→ docs/adr/0008-device-dependencies.md）。
# 開発機（Windows / macOS）に入れると uv sync が失敗して全員が止まるため、
# ここへ足すものが増えても dependencies へは移さないこと。
device = [
  "bluezero>=0.9",
  # GPIO（LED ×2 と、あとで足すセンサーの入力）。純 Python で、点滅を裏のスレッドで回せる
  # （→ `src/device/hw/led.py`。周期処理を止めずに点滅させるため）。
  "gpiozero>=2.0",
  # LCD1602A を I2C 変換基板（PCF8574）越しに叩く。どちらも純 Python なので
  # アーキテクチャを問わない（→ docs/adr/0008-device-dependencies.md）。
  "RPLCD>=1.3",
  "smbus2>=0.4",
]
# 開発機で「ラズパイのふり」をするための依存（`tools/mock_peripheral.py`）。
# **既定では入らない。** 要るときだけ `uv sync --group mock`。
#
# **`dependencies` へ移さないこと。** bless は macOS では CoreBluetooth（pyobjc）を、
# Linux では BlueZ を掴むので、**CI の Linux で入れると意味の違うものが入る。**
# 模擬は開発機で人が動かすものなので、CI では要らない。
#
# **0.3 系は入らない。** `bless` 0.3.0 は `bleak>=1.1.1`（これ自体が `winrt-* >= 3.1` を要求する）と
# `winrt-* == 2.0.0b1` の**両方**を宣言していて、**どの環境でも解決できない**（2026-09-19 に確認）。
# **Python の版とは無関係**で、bleak が 1.1.1 を出した時点から踏む状態にあった
# （3.13 へ上げてロックを取り直したときに再解決が走って表に出た）。
# **マーカーで Windows だけ外しても効かない** ——uv は全プラットフォームぶんを一度に解くため。
#
# そこで **0.2 系に固定した。** あちらは bleak 1.0 で消えた内部 module を import するので、
# 下の `[tool.uv]` で bleak も一緒に縛っている。**2つで1組**であり、片方だけ外さないこと。
# 上流が直ったら両方外す（`../../docs/adr/0008-device-dependencies.md`）。
mock = [
  "bless>=0.2,<0.3",
]

[tool.uv]
# **`bless` 0.2.6 は bleak 1.0 で消えた内部 module を import する**
# （`bleak.backends.corebluetooth.service`）。上げると `mock_peripheral.py` が起動しない。
# **`mock` グループだけの話**で、実機にも CI にも入らない。上の `bless` と一緒に外すこと。
constraint-dependencies = ["bleak<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device"]

[tool.ruff]
# Biome（TypeScript 側）と揃える。片方だけ違うと読むときに引っかかる。
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "I",   # import の並び順
  "UP",  # 古い書き方を新しい構文へ
  "B",   # よくあるバグの型
  "SIM", # 冗長な書き方
]

[tool.basedpyright]
include = ["src", "tests"]
# 既定の "recommended" は指摘が非常に多く、開発が初めての人が手を止めてしまう。
# まずは "standard" で始め、必要になったら段階的に上げる。
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
