name: 不具合
description: 動かない・おかしい
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: どうなってほしいか
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 再現の手順
      placeholder: |
        1. 
        2. 
        3. 

  - type: textarea
    id: env
    attributes:
      label: 環境
      description: OS、実行したコマンド、エラーメッセージ（全文を貼ってください）
